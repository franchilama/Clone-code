<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova barra Yess Energia</title>
<style>
  :root{ --blu:#1d2a6b; --verde:#8cc63f; --pillola:#e6e9f6; --bordo:#8f97c4; --grigio:#5a6180 }
  *{box-sizing:border-box;margin:0}
  body{font:600 1.1rem/1.3 "Source Sans 3",system-ui,"Segoe UI",Arial,sans-serif;background:#f4f6fb;color:var(--blu);padding:2rem 1rem}
  .controllo{max-width:1180px;margin:0 auto 1rem;font:500 .95rem system-ui,sans-serif;color:#333}
  .controllo label{cursor:pointer}

  /* ===== BARRA ===== */
  .barra{position:relative;max-width:1180px;margin:0 auto;background:#fff;overflow:hidden;
         padding:1.5rem 1rem 2rem;text-align:center;isolation:isolate}
  /* Foto in sottoimpressione: leggera, velata, con sfumatura obliqua */
  .barra::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:url("negozio.jpg") center 35%/cover no-repeat;
    opacity:.55;                                   /* leggerezza: 0.15 = molto tenue, 0.35 = piu' visibile */
    -webkit-mask-image:linear-gradient(105deg,transparent 8%,#000 45%,#000 100%);
            mask-image:linear-gradient(105deg,transparent 8%,#000 45%,#000 100%);  /* bordo obliquo */
    filter:saturate(.95) blur(.4px);
    transition:opacity .3s;
  }
  /* velo bianco sopra la foto per leggere bene i pulsanti */
  .barra::after{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(105deg,rgba(255,255,255,.35),rgba(255,255,255,.04) 70%);
  }
  .barra.senza::before,.barra.senza::after{opacity:0}

  .logo{mix-blend-mode:multiply;display:block;margin:0 auto 1.6rem;width:min(370px,80%);height:auto}
  .righe{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;max-width:900px;margin:0 auto}
  .pill{display:inline-flex;align-items:center;gap:.8rem;padding:.7rem 1.4rem .7rem .7rem;border-radius:999px;
        background:var(--pillola);border:3px solid var(--bordo);border-bottom-width:6px;text-decoration:none;color:var(--blu);font-weight:700}
  .pill:hover,.pill:focus-visible{background:#fff;outline:2px solid var(--blu)}
  .ico{width:70px;height:70px;border-radius:14px;display:grid;place-items:center;background:var(--grigio);color:#fff;font-size:1.4rem;flex:none}
  .ico.blu{background:var(--blu)} .ico.verde{background:var(--verde)} .ico.img{background:#fff;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .ico img{width:100%;height:100%;object-fit:contain}
  .riga-social{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;justify-content:center}
  .tondo{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:800;text-decoration:none}
  .fb{background:#1877f2}.ig{background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5)}.tt{background:#000;box-shadow:0 0 0 3px #25f4ee}
  .tel{background:#fff;border-color:#dfe3f2}
  .cta{display:inline-block;margin-top:1.2rem;background:var(--blu);color:#fff;padding:1rem 3rem;border-radius:999px;border-bottom:6px solid #0e1744;text-decoration:none;font-weight:700}
  @media (max-width:600px){ .ico{width:54px;height:54px} .pill{font-size:1rem} }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{background:#12141c} :root:not([data-theme="light"]) .controllo{color:#ddd} }
  :root[data-theme="dark"] body{background:#12141c} :root[data-theme="dark"] .controllo{color:#ddd}
</style>
</head>
<body>
<div class="controllo"><label><input type="checkbox" id="foto" checked> Mostra la foto del negozio nella barra (togli la spunta per confrontare con la barra attuale)</label></div>

<header class="barra" id="barra">
  <img class="logo" src="logo.png" alt="Yess Energia">
  <nav aria-label="Menu principale">
    <div class="righe">
      <a class="pill" href="#"><span class="ico blu">⌂</span>Home</a>
      <a class="pill" href="#"><span class="ico verde">☀</span>Fotovoltaico</a>
      <a class="pill" href="#"><span class="ico img"><img src="icona-sai.png" alt=""></span>Caldaie &amp; Clima</a>
      <a class="pill" href="#"><span class="ico img"><img src="icona-loro.png" alt=""></span>Luce &amp; Gas</a>
      <a class="pill" href="#"><span class="ico">☺</span>Chi siamo</a>
      <a class="pill" href="#"><span class="ico">✉</span>Contatti</a>
      <span class="riga-social">
        <a class="tondo fb" href="#" aria-label="Facebook">f</a>
        <a class="tondo ig" href="#" aria-label="Instagram">◎</a>
        <a class="tondo tt" href="#" aria-label="TikTok">♪</a>
      </span>
      <a class="pill tel" href="tel:3483285974"><span class="ico verde">✆</span>348 328 5974</a>
    </div>
  </nav>
  <a class="cta" href="#">Richiedi consulenza →</a>
</header>

<script>
  document.getElementById('foto').addEventListener('change',function(){
    document.getElementById('barra').classList.toggle('senza',!this.checked);
  });
</script>
</body>
</html>
